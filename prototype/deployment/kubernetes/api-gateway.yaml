apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: api-security
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: api-gateway
        image: api-security/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_CONFIG_LOCATION
          value: file:/config/api-gateway.yml
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-security-secrets
              key: jwt-secret
        volumeMounts:
        - name: config-volume
          mountPath: /config
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: api-security-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: api-security
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer
