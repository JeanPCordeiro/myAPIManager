apiVersion: v1
kind: ConfigMap
metadata:
  name: api-security-config
  namespace: api-security
data:
  # Configuration de l'API Gateway
  api-gateway.yml: |
    spring:
      cloud:
        gateway:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/auth/**, /authorization/**
            - id: resource-service
              uri: http://resource-service:8082
              predicates:
                - Path=/resource/**, /public/**
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
      redis:
        host: redis
        port: 6379
    
    logging:
      level:
        root: INFO
        com.example: DEBUG
  
  # Configuration du service d'authentification
  auth-service.yml: |
    server:
      port: 8081
    
    spring:
      application:
        name: auth-service
    
    logging:
      level:
        root: INFO
        com.example: DEBUG
    
    token:
      expiration: 1800  # 30 minutes en secondes
  
  # Configuration du service de ressources
  resource-service.yml: |
    server:
      port: 8082
    
    spring:
      application:
        name: resource-service
    
    auth:
      service:
        url: http://auth-service:8081
    
    logging:
      level:
        root: INFO
        com.example: DEBUG
