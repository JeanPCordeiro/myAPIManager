server:
  port: 8082

spring:
  application:
    name: resource-service
  datasource:
    url: jdbc:h2:mem:resourcedb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/issuer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
